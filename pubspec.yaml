name: meniscus
description: Liquid glass for Flutter, drawn by a fragment shader that refracts the page backdrop.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.5
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  shaders:
    - shaders/meniscus.frag
    - shaders/meniscus_edge.frag
